name: Check new notices

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다
  workflow_dispatch:          # Actions 탭에서 수동 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/check
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/check"
