name: Check new notices

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  actions: write    # 이 워크플로를 다시 켜기(keepalive)용
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/check
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/check"

      # GitHub은 60일간 레포 활동이 없으면 예약 실행을 끔.
      # '켜기' 요청을 보내면 그 60일 카운트가 초기화되므로, 하루 한 번 보내서 계속 켜둠.
      # (커밋을 만들지 않아서 기록이 지저분해지지 않음)
      - name: Keep schedule alive
        if: always()   # 위 단계가 실패해도(학교 사이트 장애 등) 실행
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "15" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check.yml/enable"
            echo "예약 실행 유지 요청 완료"
          else
            echo "오늘 유지 요청은 한국시간 0시대에 보내요 (지금 UTC ${HOUR}시)"
          fi
